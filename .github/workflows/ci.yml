name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runner images cannot be pinned by digest; the runner label
# names an exact OS release and every toolchain the jobs use is installed at
# an exact, checksum-verified version (see ADR-0017). The Makefile refuses to
# run with any Go other than the pinned one.
env:
  GOTOOLCHAIN: local

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - name: Tools
        run: make tools
      - name: Pinned versions
        run: make pincheck
      - name: Modules tidy
        run: make tidy-check
      - name: Generated code up to date
        run: make generate-check
      - name: Lint
        run: make lint
      - name: OpenAPI lint (vacuum, Portun ruleset)
        run: make api-lint
      - name: OpenAPI breaking changes (oasdiff against the baseline)
        run: make api-diff
      - name: Vulnerabilities
        run: make vuln
      - name: Secrets (working tree)
        run: make secrets
      - name: Secrets (git history)
        run: make secrets-history
      - name: Build
        run: make build
      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache: false
      - name: Integration tests (PostgreSQL, Valkey, NATS in Docker)
        run: make test-integration
      - name: Coverage gate
        run: make cover-check
