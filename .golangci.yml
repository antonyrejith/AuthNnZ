version: "2"
run:
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - gosec
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagliatelle
    - thelper
    - tparallel
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
    gocognit:
      min-complexity: 20
    sloglint:
      attr-only: true
      key-naming-case: snake
      context: scope
      no-global: all
    tagliatelle:
      case:
        rules:
          json: snake
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errs.New(
        - errs.Wrap(
        - .WithFields(
        - (context.Context).Err()
    depguard:
      rules:
        banned:
          deny:
            - pkg: "math/rand$"
              desc: "use crypto/rand for anything security related, math/rand/v2 otherwise"
            - pkg: "log$"
              desc: "use log/slog"
            - pkg: "github.com/pkg/errors"
              desc: "use the standard errors package and fmt.Errorf with %w"
        # Module layers (ADR-0016). depguard matches import paths by prefix,
        # so "an application layer never imports an adapter layer" (a
        # wildcard module name) is enforced by tools/layercheck (make lint),
        # which also re-checks these two rules.
        domain-layer:
          list-mode: strict
          files:
            - "**/internal/modules/*/internal/domain/**"
          allow:
            - $gostd
            - github.com/antonyrejith/portun/internal/platform/ids$
            - github.com/antonyrejith/portun/internal/platform/errs$
        platform-independent-of-modules:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/antonyrejith/portun/internal/modules
              desc: "platform packages must not import business modules (ADR-0016)"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
          - wrapcheck
          - gocognit
          - gosec
          - forbidigo
      - path: tools/(pincheck|covercheck|layercheck)/
        linters:
          - forbidigo
          - gochecknoglobals
formatters:
  enable:
    - gofumpt
    - goimports
